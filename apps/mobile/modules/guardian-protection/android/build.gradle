plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.guardian'
version = '0.1.0'

android {
  namespace "expo.modules.guardianprotection"
  buildFeatures {
    buildConfig true
  }
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    // These must be the exact release-admission environment values. Gradle
    // properties are deliberately ignored so a local -P value cannot shadow CI.
    def trustedKeys = System.getenv("GUARDIAN_POLICY_TRUSTED_PUBLIC_KEYS") ?: "{}"
    def activePolicyKeyId = System.getenv("GUARDIAN_POLICY_KEY_ID") ?: ""
    def dohUrl = System.getenv("GUARDIAN_DOH_URL") ?: ""
    buildConfigField "String", "GUARDIAN_POLICY_TRUSTED_PUBLIC_KEYS", "\"${trustedKeys.replace("\\", "\\\\").replace("\"", "\\\"")}\""
    buildConfigField "String", "GUARDIAN_POLICY_KEY_ID", "\"${activePolicyKeyId.replace("\\", "\\\\").replace("\"", "\\\"")}\""
    buildConfigField "String", "GUARDIAN_DOH_URL", "\"${dohUrl.replace("\\", "\\\\").replace("\"", "\\\"")}\""
    buildConfigField "boolean", "GUARDIAN_NON_RELEASE_FIXTURES_ENABLED", "false"
  }
}

dependencies {
  implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
  androidTestImplementation 'androidx.test:core:1.6.1'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  androidTestImplementation 'androidx.test:runner:1.6.2'
}
