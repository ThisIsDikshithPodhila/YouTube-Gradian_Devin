apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def releaseValue = { String name ->
    return (System.getenv(name) ?: "").trim()
}
def releaseStoreFileValue = releaseValue("GUARDIAN_RELEASE_STORE_FILE")
def releaseStorePassword = releaseValue("GUARDIAN_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = releaseValue("GUARDIAN_RELEASE_KEY_ALIAS")
def releaseKeyPassword = releaseValue("GUARDIAN_RELEASE_KEY_PASSWORD")
def releaseStoreType = releaseValue("GUARDIAN_RELEASE_STORE_TYPE") ?: "JKS"
def releaseCertificateDigest = releaseValue("GUARDIAN_RELEASE_CERT_SHA256").replace(":", "").toLowerCase()
def releaseVersionCodeValue = releaseValue("GUARDIAN_RELEASE_VERSION_CODE")

def releaseAdmissionEnvironment = [
    "EXPO_PUBLIC_API_URL",
    "GUARDIAN_DOH_URL",
    "GUARDIAN_POLICY_TRUSTED_PUBLIC_KEYS",
    "GUARDIAN_RELEASE_STORE_FILE",
    "GUARDIAN_RELEASE_STORE_PASSWORD",
    "GUARDIAN_RELEASE_KEY_ALIAS",
    "GUARDIAN_RELEASE_KEY_PASSWORD",
    "GUARDIAN_RELEASE_STORE_TYPE",
    "GUARDIAN_RELEASE_CERT_SHA256",
    "GUARDIAN_POLICY_KEY_ID",
    "GUARDIAN_RELEASE_VERSION_CODE",
    "GUARDIAN_ENABLE_TEST_FIXTURES",
].collectEntries { name -> [name, name == "GUARDIAN_RELEASE_STORE_FILE" && releaseStoreFileValue ? file(releaseStoreFileValue).absolutePath : releaseValue(name)] }

configurations {
    guardianBundletool {
        canBeConsumed = false
        canBeResolved = true
    }
}

def verifyReleaseCertificate = {
    if (!releaseStoreFileValue || !releaseStorePassword || !releaseKeyAlias || !releaseKeyPassword) {
        throw new GradleException("Release signing keystore path, passwords, and alias must be configured.")
    }
    def signingStore = file(releaseStoreFileValue)
    if (!signingStore.isFile()) throw new GradleException("Release signing keystore path must be an existing regular file.")
    if (!(releaseCertificateDigest ==~ /^[a-f0-9]{64}$/)) throw new GradleException("GUARDIAN_RELEASE_CERT_SHA256 must be a SHA-256 certificate digest.")
    try {
        def keyStore = java.security.KeyStore.getInstance(releaseStoreType)
        signingStore.withInputStream { keyStore.load(it, releaseStorePassword.toCharArray()) }
        if (!keyStore.containsAlias(releaseKeyAlias)) throw new GradleException("Release signing alias is absent from the configured keystore.")
        def certificate = keyStore.getCertificate(releaseKeyAlias)
        if (!certificate) throw new GradleException("Release signing alias has no certificate.")
        def subject = certificate instanceof java.security.cert.X509Certificate ? certificate.subjectX500Principal.name : ""
        if (releaseKeyAlias.equalsIgnoreCase("androiddebugkey") || subject.toLowerCase().contains("cn=android debug")) {
            throw new GradleException("Release builds must not use an Android debug certificate.")
        }
        def actualDigest = java.security.MessageDigest.getInstance("SHA-256").digest(certificate.encoded).collect { String.format("%02x", it & 0xff) }.join()
        if (actualDigest != releaseCertificateDigest) throw new GradleException("Release signing certificate does not match GUARDIAN_RELEASE_CERT_SHA256.")
    } catch (GradleException exception) {
        throw exception
    } catch (Exception exception) {
        throw new GradleException("Release signing keystore could not be verified.", exception)
    }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    // Expo SDK 57's versioned compatibility table requires compile/target SDK 36.
    compileSdk 36

    namespace 'com.guardian.family'
    defaultConfig {
        applicationId 'com.guardian.family'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseStoreFileValue) storeFile file(releaseStoreFileValue)
            if (releaseStorePassword) storePassword releaseStorePassword
            if (releaseKeyAlias) keyAlias releaseKeyAlias
            if (releaseKeyPassword) keyPassword releaseKeyPassword
            storeType releaseStoreType
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        if (releaseVersionCodeValue ==~ /^[1-9]\d*$/) {
            variant.outputs.forEach { output -> output.versionCode.set(releaseVersionCodeValue.toInteger()) }
        }
    }
}

tasks.register("verifyGuardianReleaseAdmission", Exec) {
    group = "verification"
    description = "Fails release builds without validated signing, public policy authority, endpoints, version code, and fixture mode."
    workingDir projectRoot
    commandLine "node", new File(projectRoot, "scripts/release-admission.mjs").absolutePath
    environment releaseAdmissionEnvironment
    doFirst { verifyReleaseCertificate() }
}

def configureReleaseArtifactVerification = { String taskName, String kind, String outputDirectory, String outputPattern ->
tasks.register(taskName, Exec) {
    group = "verification"
    description = "Verifies the shipping artifact manifest, fixture absence, signer, and version of the signed release ${kind.toUpperCase()}."
    workingDir projectRoot
    environment releaseAdmissionEnvironment
    doFirst {
        def artifacts = fileTree(outputDirectory).matching { include outputPattern }.files
        if (artifacts.size() != 1) throw new GradleException("Expected exactly one signed release ${kind.toUpperCase()}.")
        def aapt = new File(android.sdkDirectory, "build-tools/${android.buildToolsVersion}/aapt")
        def apksigner = new File(android.sdkDirectory, "build-tools/${android.buildToolsVersion}/apksigner")
        def javaBin = new File(System.getProperty("java.home"), "bin")
        def javaExecutable = new File(javaBin, "java")
        def keytool = new File(javaBin, "keytool")
        def jarsigner = new File(javaBin, "jarsigner")
        def bundletoolClasspath = kind == "aab" ? configurations.guardianBundletool.asPath : ""
        if (kind == "apk" && (!aapt.isFile() || !apksigner.isFile())) throw new GradleException("Android aapt and apksigner are required for APK policy verification.")
        if (kind == "aab" && (!javaExecutable.isFile() || !keytool.isFile() || !jarsigner.isFile() || !bundletoolClasspath)) throw new GradleException("Bundletool and JDK signing tools are required for AAB policy verification.")
        commandLine "node", new File(projectRoot, "scripts/verify-release-artifact.mjs").absolutePath,
            "--artifact", artifacts.first().absolutePath, "--kind", kind,
            "--aapt", aapt.absolutePath, "--apksigner", apksigner.absolutePath,
            "--keytool", keytool.absolutePath, "--jarsigner", jarsigner.absolutePath,
            "--java", javaExecutable.absolutePath, "--bundletool-classpath", bundletoolClasspath
    }
}
}

configureReleaseArtifactVerification("verifyGuardianReleaseApkArtifact", "apk", "$buildDir/outputs/apk/release", "**/*.apk")
configureReleaseArtifactVerification("verifyGuardianReleaseAabArtifact", "aab", "$buildDir/outputs/bundle/release", "**/*.aab")

tasks.configureEach { task ->
    if (task.name != "verifyGuardianReleaseAdmission" && (task.name ==~ /(?i).*(assemble|bundle|package|sign).*release.*/)) {
        task.dependsOn("verifyGuardianReleaseAdmission")
    }
    if (task.name in ["assembleRelease", "packageRelease"]) task.finalizedBy("verifyGuardianReleaseApkArtifact")
    if (task.name == "bundleRelease") task.finalizedBy("verifyGuardianReleaseAabArtifact")
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    guardianBundletool "com.android.tools.build:bundletool:1.18.1"
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
