name: mobile

on:
  push:
    paths:
      - "apps/mobile/**"
      - "packages/contracts/**"
      - "packages/policy-schema/**"
      - "packages/design-tokens/**"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/contracts/**"
      - "packages/policy-schema/**"
      - "packages/design-tokens/**"
      - "pnpm-lock.yaml"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter guardian-mobile lint
      - run: pnpm --filter guardian-mobile typecheck
      - run: pnpm --filter guardian-mobile test --runInBand

  android-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile
      - run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - run: ./gradlew :guardian-protection:assembleDebug :guardian-protection:testDebugUnitTest
        working-directory: apps/mobile/android

  android-role-apks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [parent, child]
    env:
      EXPO_PUBLIC_GUARDIAN_ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Android SDK and NDK
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/guardian-android-sdk"
          archive="$RUNNER_TEMP/guardian-cmdline-tools.zip"
          mkdir -p "$sdk_root/cmdline-tools"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$archive"
          echo "2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null <<'EOF'
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          EOF
          "$sdkmanager" --sdk_root="$sdk_root" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          test "$(awk -F' = ' '/Pkg.Revision/{print $2}' "$sdk_root/ndk/27.1.12297006/source.properties")" = "27.1.12297006"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
      - run: ./gradlew -PguardianRole="${{ matrix.role }}" -PreactNativeArchitectures=x86_64 :app:assembleDebug --no-daemon
        working-directory: apps/mobile/android
      - name: Verify role package and signer
        run: |
          set -euo pipefail
          apk=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          role="${{ matrix.role }}"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.guardian.family.$role'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "application-label:'Guardian ${role^}'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"

  mobile-state-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter guardian-mobile test --runInBand src/api src/state src/auth

  mobile-surface-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter guardian-mobile exec jest --runInBand src/new-routes.test.tsx src/screens.test.tsx
