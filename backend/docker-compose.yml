services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: guardian
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - guardian-postgres:/var/lib/postgresql/data

volumes:
  guardian-postgres:
