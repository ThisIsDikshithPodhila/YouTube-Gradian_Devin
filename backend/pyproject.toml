[project]
name = "guardian-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.16.4",
  "argon2-cffi==25.1.0",
  "asyncpg==0.30.0",
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "email-validator==2.2.0",
  "pydantic-settings==2.10.1",
  "pyjwt[crypto]==2.13.0",
  "sqlalchemy[asyncio]==2.0.41",
  "starlette==1.3.1",
  "uvicorn[standard]==0.35.0"
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
  "types-jsonschema==4.25.1.20250822"
]

[tool.ruff]
line-length = 100
target-version = "py313"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
